name: flock-profile

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Challenge repo commit to profile"
        required: false
        default: "03e70fa0237ef89a66bc2ff63fd3e0d75057a0cd"
      patch_file:
        description: "Optional patch file path in THIS repo to apply (git apply)"
        required: false
        default: ""
      log2:
        description: "BLAKE3_LOG2"
        required: false
        default: "18"
      threads:
        description: "RAYON_NUM_THREADS / worker threads"
        required: false
        default: "4"
      seeds:
        description: "Comma-separated seeds to prove"
        required: false
        default: "1234567,987654321"

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Runner info
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)' || true; free -h | head -2

      - name: Checkout challenge repo (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: Layr-Labs/flock-challenge-multi
          ref: ${{ github.event.inputs.commit }}
          persist-credentials: false

      - name: Apply patch (optional)
        if: ${{ github.event.inputs.patch_file != '' }}
        run: |
          set -e
          git apply --check "${{ github.event.inputs.patch_file }}"
          git apply "${{ github.event.inputs.patch_file }}"
          git diff --stat

      - name: Cache cargo + rustup
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
          key: flock-${{ github.event.inputs.commit }}-v1
          restore-keys: flock-

      - name: Setup (build worker)
        run: ./setup.sh

      - name: Direct worker phase traces
        env:
          FLOCK_GAP_TIMING: "1"
          FLOCK_ABS_TRACE: "1"
          RAYON_NUM_THREADS: ${{ github.event.inputs.threads }}
          LOG2: ${{ github.event.inputs.log2 }}
        run: |
          source "$HOME/.cargo/env"
          WORKER=target/challenge-candidate/challenge/flock-benchmark-worker
          ls -la "$WORKER"
          rm -f worker-trace.log
          echo "=== MODE A: seed pre-buffered (stdin before worker start) ===" | tee -a worker-trace.log
          SEED=$(echo "${{ github.event.inputs.seeds }}" | cut -d, -f1)
          echo "$SEED" | timeout 900 "$WORKER" "${{ github.event.inputs.log2 }}" \
            /tmp/ready-file /tmp/proof.bin 2>&1 | tee -a worker-trace.log \
            || echo "(worker exit=$?)" | tee -a worker-trace.log
          ls -la /tmp/proof.bin 2>/dev/null | tee -a worker-trace.log
          rm -f /tmp/proof.bin /tmp/ready-file

          echo "=== MODE B: harness protocol (spawn, wait for ready, then seed + timer) ===" | tee -a worker-trace.log
          python3 - <<'PYEOF' 2>&1 | tee -a worker-trace.log
          import subprocess, time, os, random, hashlib
          worker = "target/challenge-candidate/challenge/flock-benchmark-worker"
          log2 = os.environ.get("LOG2", "18")
          for trial in range(2):
              random.seed()
              seed = random.getrandbits(64)
              ready = f"/tmp/ready-{trial}"
              proof = f"/tmp/proof-{trial}"
              for p in (ready, proof):
                  if os.path.exists(p): os.remove(p)
              env = dict(os.environ)
              t0 = time.perf_counter()
              p = subprocess.Popen([worker, log2, ready, proof], env=env,
                                   stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                                   stderr=subprocess.STDOUT)
              while not os.path.exists(ready):
                  if p.poll() is not None: break
                  time.sleep(0.001)
              t_ready = time.perf_counter() - t0
              p.stdin.write(f"{seed}\n".encode()); p.stdin.flush()
              while not os.path.exists(proof):
                  if p.poll() is not None: break
                  time.sleep(0.001)
              t_proof = time.perf_counter() - t0
              size = os.path.getsize(proof) if os.path.exists(proof) else -1
              h = hashlib.sha256(open(proof,'rb').read()).hexdigest()[:16] if size>0 else "-"
              p.kill()
              print(f"trial {trial}: seed={seed} ready_after={t_ready:.3f}s "
                    f"seed_to_proof={t_proof-t_ready:.3f}s total={t_proof:.3f}s "
                    f"proof={size}B sha={h}")
          PYEOF
          rm -f /tmp/proof-* /tmp/ready-*

      - name: Phase summary
        if: always()
        run: |
          {
            echo "## Worker phase traces — **directional only (4 vCPU), NOT comparable to official 16-vCPU SPR**"
            echo
            echo '```'
            grep -E "^\[gap\]" worker-trace.log 2>/dev/null | head -120 || echo "no gap lines"
            echo '```'
            echo '```'
            grep -E "^\[abs\]" worker-trace.log 2>/dev/null | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-trace-${{ github.run_id }}
          path: worker-trace.log
